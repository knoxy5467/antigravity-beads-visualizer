<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Antigravity Beads Visualizer</title>
  <link rel="stylesheet" href="/ui/styles.css" />
</head>
<body>
  <header class="bv-header">
    <div class="bv-header-left">
      <h1 data-testid="bv-title">Beads Visualizer</h1>
      <span class="bv-env-banner" data-testid="bv-env-banner">Live Mode</span>
      <span class="bv-badge" data-testid="bv-workspace-badge">loading...</span>
      <select id="workspace-select" class="bv-select bv-select-sm" data-testid="bv-workspace-select" aria-label="Workspace selector"></select>
    </div>
    <div class="bv-header-right">
      <label class="bv-checkbox-label">
        <input id="auto-poll-toggle" type="checkbox" checked data-testid="auto-poll-toggle" />
        <span>Auto-Poll</span>
      </label>
      <button id="refresh-btn" class="bv-btn" type="button" data-testid="refresh-btn">Refresh</button>
    </div>
  </header>

  <nav class="bv-tabs" aria-label="Visualizer views">
    <button id="tab-tree" class="bv-tab is-active" type="button" data-testid="tab-tree">Epic Tree</button>
    <button id="tab-dag" class="bv-tab" type="button" data-testid="tab-dag">Dependency DAG</button>
    <button id="tab-board" class="bv-tab" type="button" data-testid="tab-board">Workflow Board</button>
    <button id="tab-gates" class="bv-tab" type="button" data-testid="tab-gates">Gates &amp; Approvals</button>
  </nav>

  <main class="bv-layout">
    <section class="bv-main-panel">
      <div id="tree-toolbar" class="bv-subtoolbar">
        <input id="search-input" class="bv-input" type="search" placeholder="Search id, title, or assignee..." data-testid="bv-search-input" />
        <select id="status-filter" class="bv-select" data-testid="bv-status-filter" aria-label="Status filter">
          <option value="all">All Statuses</option>
          <option value="open">Open</option>
          <option value="in_progress">In Progress</option>
          <option value="blocked">Blocked</option>
          <option value="closed">Closed</option>
        </select>
        <select id="priority-filter" class="bv-select" data-testid="bv-priority-filter" aria-label="Priority filter">
          <option value="all">All Priorities</option>
          <option value="0">P0</option>
          <option value="1">P1</option>
          <option value="2">P2</option>
          <option value="3">P3</option>
        </select>
      </div>

      <div id="view-tree" class="bv-view-panel" data-testid="bv-epic-tree"></div>
      <div id="view-dag" class="bv-view-panel is-hidden" data-testid="bv-dag-panel"></div>
      <div id="view-board" class="bv-view-panel is-hidden" data-testid="bv-board-panel"></div>
      <div id="view-gates" class="bv-view-panel is-hidden" data-testid="bv-gates-panel"></div>
    </section>

    <aside class="bv-inspector" data-testid="bv-inspector">
      <h2>Issue Inspector</h2>
      <div id="inspector-body" class="bv-inspector-empty">Select an epic or task to inspect details.</div>
      <div class="bv-quote-box">
        <button id="quote-btn" class="bv-btn bv-btn-primary" type="button" data-testid="bv-quote-btn" disabled>
          Prepare Quote Pill
        </button>
        <pre id="quote-preview" class="bv-quote-preview" data-testid="bv-quote-preview"></pre>
        <div id="action-status" class="bv-action-status" data-testid="bv-action-status"></div>
      </div>
    </aside>
  </main>

  <script type="module" src="/ui/app.js"></script>
</body>
</html>
